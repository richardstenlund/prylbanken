services:
  prylbanken:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Ange APP_PASSWORD i .env (minst 12 tecken)}
    volumes:
      - prylbanken-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  prylbanken-data:
